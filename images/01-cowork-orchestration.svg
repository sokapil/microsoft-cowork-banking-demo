<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#f7faff"/>
  <text x="80" y="85" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#1246a3">Executive Banking Pack for Acme Group</text>
  <text x="80" y="130" font-family="Arial, sans-serif" font-size="24" fill="#43546d">One business question in Cowork → plan → Microsoft context, data, research and banking skills</text>
  <rect x="70" y="175" width="610" height="650" rx="28" fill="#ffffff" stroke="#d5e3f7" stroke-width="3"/>
  <circle cx="120" cy="235" r="28" fill="#1e66d0"/><text x="111" y="245" font-family="Arial" font-size="28" font-weight="700" fill="white">1</text>
  <text x="165" y="245" font-family="Arial" font-size="31" font-weight="700" fill="#183a70">The banker’s decision problem</text>
  <text x="105" y="300" font-family="Arial" font-size="23" fill="#30445f">Ahead of a client or leadership meeting, the banker needs</text>
  <text x="105" y="333" font-family="Arial" font-size="23" fill="#30445f">a decision-ready view of Acme Group.</text>
  <g font-family="Arial" fill="#17375e">
    <text x="115" y="405" font-size="26" font-weight="700">How is the relationship performing?</text>
    <text x="115" y="438" font-size="20">Relationship health, engagement and stakeholders</text>
    <text x="115" y="505" font-size="26" font-weight="700">Where is the opportunity — and risk?</text>
    <text x="115" y="538" font-size="20">Live opportunities, momentum and credit/risk watch items</text>
    <text x="115" y="605" font-size="26" font-weight="700">What is changing around the client?</text>
    <text x="115" y="638" font-size="20">Working capital, payment terms, FX and financing context</text>
    <text x="115" y="705" font-size="26" font-weight="700">What should the bank do next?</text>
    <text x="115" y="738" font-size="20">Who to engage and what to progress over the next 30 days</text>
  </g>
  <rect x="100" y="765" width="550" height="40" rx="12" fill="#eaf3ff"/><text x="120" y="792" font-family="Arial" font-size="18" font-weight="700" fill="#1c4f91">The challenge: insight is spread across M365, CRM, research and specialist knowledge.</text>
  <rect x="720" y="175" width="810" height="650" rx="28" fill="#ffffff" stroke="#d5e3f7" stroke-width="3"/>
  <circle cx="770" cy="235" r="28" fill="#1e66d0"/><text x="761" y="245" font-family="Arial" font-size="28" font-weight="700" fill="white">2</text>
  <text x="815" y="245" font-family="Arial" font-size="31" font-weight="700" fill="#183a70">How Cowork solves it</text>
  <rect x="760" y="290" width="350" height="125" rx="18" fill="#eef5ff"/><text x="785" y="325" font-family="Arial" font-size="22" font-weight="700" fill="#1d4f91">Prompt in Cowork</text><text x="785" y="365" font-family="Arial" font-size="20" fill="#233f62">“Create a 2-minute executive</text><text x="785" y="393" font-family="Arial" font-size="20" fill="#233f62">banking pack for Acme Group.”</text>
  <rect x="1140" y="290" width="340" height="215" rx="18" fill="#eef5ff"/><text x="1165" y="325" font-family="Arial" font-size="22" font-weight="700" fill="#1d4f91">Cowork plan</text><g font-family="Arial" font-size="18" fill="#233f62"><text x="1165" y="360">✓ Research external context</text><text x="1165" y="389">✓ Read Acme files</text><text x="1165" y="418">✓ Run banking skills</text><text x="1165" y="447">✓ Create Word / Excel / PPT</text><text x="1165" y="476">✓ Draft manager email</text></g>
  <rect x="980" y="475" width="300" height="110" rx="24" fill="#dceaff" stroke="#8eb5ee" stroke-width="2"/><text x="1080" y="520" font-family="Arial" font-size="28" font-weight="700" fill="#164f9f">COWORK</text><text x="1017" y="555" font-family="Arial" font-size="18" fill="#28496f">plans, selects capabilities, executes</text>
  <g font-family="Arial" font-size="19" fill="#17375e">
    <rect x="760" y="455" width="190" height="85" rx="16" fill="#f4f8ff" stroke="#b9cfee"/><text x="780" y="488" font-weight="700">WorkIQ / M365</text><text x="780" y="516">relationship context</text>
    <rect x="760" y="565" width="190" height="85" rx="16" fill="#f4f8ff" stroke="#b9cfee"/><text x="780" y="598" font-weight="700">People Skills</text><text x="780" y="626">manager + stakeholders</text>
    <rect x="1310" y="535" width="190" height="85" rx="16" fill="#f4f8ff" stroke="#b9cfee"/><text x="1330" y="568" font-weight="700">Dynamics CRM</text><text x="1330" y="596">opportunities + risk</text>
    <rect x="1310" y="645" width="190" height="85" rx="16" fill="#f4f8ff" stroke="#b9cfee"/><text x="1330" y="678" font-weight="700">Deep Research</text><text x="1330" y="706">market context</text>
    <rect x="970" y="680" width="300" height="95" rx="16" fill="#f4f8ff" stroke="#b9cfee"/><text x="995" y="713" font-weight="700">Custom banking skills</text><text x="995" y="742">relationship • credit • next best action</text>
  </g>
</svg>